name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build native Google Maps collector
        run: ./scripts/build-scraper-macos.sh

      - name: Test
        run: npm test

      - name: Build DMG
        run: npm run make:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: LeadJa-macOS-arm64
          path: out/make/**/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_path="$(find out/make -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          gh release create "$GITHUB_REF_NAME" "$dmg_path" --generate-notes --title "LeadJá $GITHUB_REF_NAME"
